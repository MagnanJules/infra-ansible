- name: Updates
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe

- name: Install apt
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - curl
      - htop
      - python3-kubernetes
    state: present

- name: Activate security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Create swap file
  ansible.builtin.command: fallocate -l {{ swap_size_mb }}M /swapfile
  args:
    creates: /swapfile
  register: swapfile_created

- name: Swapfile perms
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"

- name: Format swap
  ansible.builtin.command: mkswap /swapfile
  when: swapfile_created is changed

- name: Check active swap
  ansible.builtin.command: swapon --show=NAME --noheadings
  changed_when: false
  register: active_swap

- name: Activate swap
  ansible.builtin.command: swapon /swapfile
  when: "'/swapfile' not in active_swap.stdout"

- name: Permanent swap
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^/swapfile\s'
    line: "/swapfile none swap sw 0 0"

- name: Set swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ swappiness }}"
    state: present

- name: Journald config directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Persistent journal
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/99-persistent.conf
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=400M
      SystemMaxFileSize=50M
      MaxRetentionSec=2week
      RateLimitIntervalSec=30s
      RateLimitBurst=5000
    mode: "0644"
  notify: restart journald

- name: Check reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Reboot if necessary
  ansible.builtin.reboot:
  when: reboot_required.stat.exists
