- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allowing SSH
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Allow traffic from pods/services to host
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
  loop:
    - "{{ k8s_pod_cidr }}"
    - "{{ k8s_service_cidr }}"

- name: Default incoming policy
  community.general.ufw:
    default: deny
    direction: incoming

- name: Default outgoing policy
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Allowing firewall
  community.general.ufw:
    state: enabled

- name: Allow HTTP
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPs
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
