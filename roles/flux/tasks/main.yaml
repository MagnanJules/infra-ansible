- name: Install Flux CLI
  ansible.builtin.shell: curl -s https://fluxcd.io/install.sh | bash
  args:
    creates: /usr/local/bin/flux

- name: Create flux-sys namespace
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: flux-system


- name: Age key
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: sops-age
        namespace: flux-system
      type: Opaque
      stringData:
        age.agekey: "{{ sops_age_key }}"
  no_log: true

- name: Check flux install
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    kind: Deployment
    namespace: flux-system
    name: kustomize-controller
  register: flux_installed

- name: Flux Bootstrap 
  ansible.builtin.command: >-
    flux bootstrap github
    --owner={{ github_user }}
    --repository={{ fleet_repo }}
    --branch=main
    --personal
    --path=clusters/{{ cluster_name }}
    --components=source-controller,kustomize-controller,helm-controller
  environment:
    GITHUB_TOKEN: "{{ github_bootstrap_token }}"
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  when: flux_installed.resources | length == 0
  no_log: true

- name: Vérifier la santé de Flux
  ansible.builtin.command: flux check
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
