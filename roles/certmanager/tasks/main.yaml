- name: Install cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: cert-manager
    chart_repo_url: https://charts.jetstack.io
    chart_version: "{{ certmanager_chart_version }}"
    release_namespace: cert-manager
    create_namespace: true
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values:
      crds:
        enabled: true
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 128Mi }
      webhook:
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { memory: 64Mi }
      cainjector:
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 128Mi }
    wait: true

- name: Create Let's encrypt emitters
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'issuers.yaml.j2') | from_yaml_all | list }}"
