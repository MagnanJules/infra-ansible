- name: Install VictoriaMetrics
  kubernetes.core.helm:
    name: vmsingle
    chart_ref: victoria-metrics-single
    chart_repo_url: https://victoriametrics.github.io/helm-charts/
    chart_version: "{{ vm_chart_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: true
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values: "{{ lookup('ansible.builtin.template', 'vm-values.yaml.j2') | from_yaml }}"
    wait: true

- name: Find pre-Helm Jaeger objects
  kubernetes.core.k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    kind: "{{ item }}"
    namespace: "{{ monitoring_namespace }}"
    name: jaeger
  loop: [Deployment, Service]
  register: legacy_jaeger

- name: Remove pre-Helm Jaeger objects
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: absent
    api_version: "{{ item.resources[0].apiVersion }}"
    kind: "{{ item.resources[0].kind }}"
    namespace: "{{ monitoring_namespace }}"
    name: jaeger
  when:
    - item.resources | length > 0
    - item.resources[0].metadata.labels['app.kubernetes.io/managed-by'] | default('') != 'Helm'
  loop: "{{ legacy_jaeger.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Install Jaeger
  kubernetes.core.helm:
    name: jaeger
    chart_ref: jaeger
    chart_repo_url: https://jaegertracing.github.io/helm-charts
    chart_version: "{{ jaeger_chart_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values: "{{ lookup('ansible.builtin.template', 'jaeger-values.yaml.j2') | from_yaml }}"
    wait: true

- name: Install Grafana
  kubernetes.core.helm:
    name: grafana
    chart_ref: grafana
    chart_repo_url: https://grafana-community.github.io/helm-charts
    chart_version: "{{ grafana_chart_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values: "{{ lookup('ansible.builtin.template', 'grafana-values.yaml.j2') | from_yaml }}"
    wait: false
    atomic: false

- name: Expose /grafana
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition: "{{ lookup('ansible.builtin.template', 'grafana-ingress.yaml.j2') | from_yaml }}"

